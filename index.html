<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#2d2017">
<meta name="description" content="Pororoca: trivia de respostas raras. Quanto mais rara a resposta, maior a onda que leva a Capi rio acima.">
<title>Pororoca</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="manifest" href="./manifest.webmanifest">
</head>
<body>
<div id="app">

 <!-- Início -->
 <section id="home" class="scr on">
  <div class="top">
   <span class="sp"></span>
   <button class="ico" data-rules aria-label="Regras">?</button>
   <button class="ico" id="archBtn" aria-label="Arquivo"><svg viewBox="0 0 11 11"><path d="M1 2h9v8H1z" fill="#fff"/><path d="M1 2h9v1H1zM1 3h1v7H1zM9 3h1v7H9zM2 9h7v1H2zM1 4h9v1H1zM3 1h1v2H3zM7 1h1v2H7z" fill="#2d2017"/><path d="M3 6h1v1H3zM5 6h1v1H5zM7 6h1v1H7z" fill="#f08a2c"/></svg></button>
   <button class="ico" id="rankBtn" aria-label="Ranking de hoje" hidden><svg viewBox="0 0 11 11"><path d="M2 1h7v1H2zM1 2h2v1H1zM8 2h2v1H8zM1 3h1v2H1zM9 3h1v2H9zM2 5h1v1H2zM8 5h1v1H8zM3 2h5v4H3zM4 6h3v1H4zM5 7h1v1H5zM3 8h5v1H3zM2 9h7v1H2z" fill="#2d2017"/><path d="M4 3h1v2H4z" fill="#f08a2c"/></svg></button>
   <button class="ico" id="statsBtn" aria-label="Estatísticas"><svg viewBox="0 0 11 11"><path d="M1 6h2v4H1zM4.5 2h2v8h-2zM8 4h2v6H8z" fill="#2d2017"/></svg></button>
  </div>
  <h1 class="logo">Pororoca</h1>
  <div class="stage homestage"><canvas id="homeCv"></canvas></div>
  <button class="play px" id="playBtn">Jogar</button>
  <div class="row">
   <button class="sec px" id="infBtn">Infinito</button>
   <button class="sec px" id="duelBtn">Duelo</button>
  </div>
  <section class="board" id="board" aria-label="Ranking de hoje" hidden>
   <button class="bt" id="boardBtn">Ranking de hoje<span>ver tudo</span></button>
   <ol class="rk" id="boardList"></ol>
  </section>
  <p class="credit">desenvolvido por Luiz Hong</p>
 </section>

 <!-- Pergunta + onda -->
 <section id="q" class="scr">
  <div class="qa" id="qa">
   <div class="top">
    <button class="ico" id="quitBtn" aria-label="Sair"><svg viewBox="0 0 9 9"><path d="M1 1h1v1H1zM2 2h1v1H2zM3 3h1v1H3zM4 4h1v1H4zM5 5h1v1H5zM6 6h1v1H6zM7 7h1v1H7zM7 1h1v1H7zM6 2h1v1H6zM5 3h1v1H5zM3 5h1v1H3zM2 6h1v1H2zM1 7h1v1H1z" fill="#2d2017"/></svg></button>
    <div class="dots" id="dots"></div>
    <button class="ico" data-rules aria-label="Regras">?</button>
   </div>
   <div class="bar" id="timer"><i id="bar"></i></div>
   <p class="rv" id="rv" hidden></p>
   <p class="theme" id="qtheme"></p>
   <h2 class="qtext" id="qtext" aria-live="polite"></h2>
  </div>
  <div class="stage"><canvas id="qCv"></canvas><div class="gain" id="gain"></div></div>
  <div class="hint" id="hint" aria-live="polite"></div>
  <form class="ans" id="form" autocomplete="off">
   <input id="inp" class="px" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" maxlength="60" placeholder="sua resposta" aria-label="Sua resposta">
   <button class="go px" aria-label="Enviar"><svg viewBox="0 0 9 9"><path d="M1 4h5v1H1zM4 2h1v1H4zM5 3h1v1H5zM6 4h1v1H6zM5 5h1v1H5zM4 6h1v1H4z" fill="#2d2017"/></svg></button>
  </form>
 </section>

 <!-- Resultado -->
 <section id="r" class="scr">
  <div class="top">
   <button class="ico" id="homeBtn" aria-label="Início"><svg viewBox="0 0 11 11"><path d="M5 1h1v1H5zM4 2h3v1H4zM3 3h5v1H3zM2 4h7v1H2zM2 5h7v5H2z" fill="#2d2017"/><path d="M5 7h1v3H5z" fill="#fff"/></svg></button>
   <span class="sp"></span>
   <button class="ico" data-rules aria-label="Regras">?</button>
  </div>
  <p class="km"><span id="kmv">0</span><small>km</small></p>
  <p class="animal" id="animal"><canvas id="anCv"></canvas><span id="anName"></span></p>
  <p class="vs" id="vs" hidden></p>
  <form class="rank" id="rankForm" autocomplete="off" hidden>
   <input id="rankName" class="px" maxlength="20" placeholder="seu nome" aria-label="Seu nome no ranking" enterkeyhint="send">
   <button class="sec px" id="rankGo">Ranking</button>
  </form>
  <p class="rankmsg" id="rankMsg" hidden></p>
  <div class="map"><p class="maptitle">Rio Amazonas</p><div class="box" id="mapBox"><canvas id="mapCv"></canvas></div></div>
  <div class="bars" id="bars"></div>
  <button class="play px" id="shareBtn">Compartilhar</button>
  <div class="row">
   <button class="sec px" id="ansBtn">Ver respostas</button>
   <button class="sec px" id="againBtn">De novo</button>
  </div>
  <button class="sec px" id="contestBtn" hidden>Enviar contestações</button>
 </section>

 <!-- Regras -->
 <div class="sheet" id="rules" role="dialog" aria-modal="true" aria-label="Regras">
  <div class="panel">
   <div class="top"><span class="sp"></span><button class="ico" data-close aria-label="Fechar"><svg viewBox="0 0 9 9"><path d="M1 1h1v1H1zM2 2h1v1H2zM3 3h1v1H3zM4 4h1v1H4zM5 5h1v1H5zM6 6h1v1H6zM7 7h1v1H7zM7 1h1v1H7zM6 2h1v1H6zM5 3h1v1H5zM3 5h1v1H3zM2 6h1v1H2zM1 7h1v1H1z" fill="#2d2017"/></svg></button></div>
   <div class="card px"><canvas data-icon="clock"></canvas><p>Responda em 45 segundos.</p></div>
   <div class="card px"><canvas data-icon="wave"></canvas><p>Quanto mais rara a resposta, maior a onda.</p></div>
   <div class="card px"><canvas data-icon="river"></canvas><p>Em 7 ondas, veja até onde a Capi chega.</p></div>
  </div>
 </div>

 <!-- Ver respostas -->
 <div class="sheet" id="answers" role="dialog" aria-modal="true" aria-label="Respostas">
  <div class="panel">
   <div class="top"><span class="sp"></span><button class="ico" data-close aria-label="Fechar"><svg viewBox="0 0 9 9"><path d="M1 1h1v1H1zM2 2h1v1H2zM3 3h1v1H3zM4 4h1v1H4zM5 5h1v1H5zM6 6h1v1H6zM7 7h1v1H7zM7 1h1v1H7zM6 2h1v1H6zM5 3h1v1H5zM3 5h1v1H3zM2 6h1v1H2zM1 7h1v1H1z" fill="#2d2017"/></svg></button></div>
   <ul class="alist" id="alist"></ul>
  </div>
 </div>

 <!-- Arquivo -->
 <div class="sheet" id="archive" role="dialog" aria-modal="true" aria-label="Arquivo">
  <div class="panel">
   <div class="top"><h2>Arquivo</h2><span class="sp"></span><button class="ico" data-close aria-label="Fechar"><svg viewBox="0 0 9 9"><path d="M1 1h1v1H1zM2 2h1v1H2zM3 3h1v1H3zM4 4h1v1H4zM5 5h1v1H5zM6 6h1v1H6zM7 7h1v1H7zM7 1h1v1H7zM6 2h1v1H6zM5 3h1v1H5zM3 5h1v1H3zM2 6h1v1H2zM1 7h1v1H1z" fill="#2d2017"/></svg></button></div>
   <ul class="days" id="days"></ul>
  </div>
 </div>

 <!-- Estatísticas -->
 <div class="sheet" id="stats" role="dialog" aria-modal="true" aria-label="Estatísticas">
  <div class="panel">
   <div class="top"><h2>Estatísticas</h2><span class="sp"></span><button class="ico" data-close aria-label="Fechar"><svg viewBox="0 0 9 9"><path d="M1 1h1v1H1zM2 2h1v1H2zM3 3h1v1H3zM4 4h1v1H4zM5 5h1v1H5zM6 6h1v1H6zM7 7h1v1H7zM7 1h1v1H7zM6 2h1v1H6zM5 3h1v1H5zM3 5h1v1H3zM2 6h1v1H2zM1 7h1v1H1z" fill="#2d2017"/></svg></button></div>
   <div id="statsBody"></div>
  </div>
 </div>

 <!-- Duelo -->
 <div class="sheet" id="duel" role="dialog" aria-modal="true" aria-label="Duelo">
  <div class="panel">
   <div class="top"><h2>Duelo</h2><span class="sp"></span><button class="ico" data-close aria-label="Fechar"><svg viewBox="0 0 9 9"><path d="M1 1h1v1H1zM2 2h1v1H2zM3 3h1v1H3zM4 4h1v1H4zM5 5h1v1H5zM6 6h1v1H6zM7 7h1v1H7zM7 1h1v1H7zM6 2h1v1H6zM5 3h1v1H5zM3 5h1v1H3zM2 6h1v1H2zM1 7h1v1H1z" fill="#2d2017"/></svg></button></div>
   <p class="lead" id="duelText"></p>
   <div class="link" id="duelLink" hidden><input id="duelUrl" readonly aria-label="Link do duelo"><button class="sec px" id="duelCopy">Copiar</button></div>
   <p class="wait" id="duelWait" hidden></p>
   <button class="play px" id="duelGo">Jogar</button>
  </div>
 </div>

 <!-- Ranking do dia -->
 <div class="sheet" id="ranking" role="dialog" aria-modal="true" aria-label="Ranking de hoje">
  <div class="panel">
   <div class="top"><h2>Ranking de hoje</h2><span class="sp"></span><button class="ico" data-close aria-label="Fechar"><svg viewBox="0 0 9 9"><path d="M1 1h1v1H1zM2 2h1v1H2zM3 3h1v1H3zM4 4h1v1H4zM5 5h1v1H5zM6 6h1v1H6zM7 7h1v1H7zM7 1h1v1H7zM6 2h1v1H6zM5 3h1v1H5zM3 5h1v1H3zM2 6h1v1H2zM1 7h1v1H1z" fill="#2d2017"/></svg></button></div>
   <p class="sub" id="rankDay"></p>
   <ol class="rk" id="rankList"></ol>
  </div>
 </div>

 <div class="toast" id="toast" role="status"></div>
</div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
